name: Bug report
description: The linter, the filler, or a template is not working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, check the [FAQ in the README](../blob/main/README.md#faq).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python lint_prompt.py my_prompt.md`
        2. See output Y
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.4"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or error message
      description: Paste the terminal output. Remove any phone numbers, names or keys.
      render: shell
